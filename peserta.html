<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titik Kumpul Polege — Lomba</title>
<style>
:root{--ink:#172235;--muted:#687386;--paper:#f5f7fa;--card:#fff;--line:#e7ebf1;--navy:#101827;--navy2:#1a2940;--gold:#e5b65b;--gold2:#f5d895;--green:#287c62;--red:#b3392f;--radius:22px;--shadow:0 14px 40px rgba(23,34,53,.08);--max:1160px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
.container{width:min(var(--max),calc(100% - 40px));margin:auto}
.topbar{background:var(--navy);color:#dbe3ef;font-size:12px}.topbar .container{display:flex;justify-content:space-between;gap:16px;padding:9px 0}.topbar strong{color:var(--gold2);letter-spacing:.12em}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,235,241,.9)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:-.04em}
.brand-mark{width:43px;height:43px;border-radius:14px;background:var(--navy);display:grid;place-items:center;color:var(--gold);font-size:17px;font-weight:900;letter-spacing:-.08em}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.17em;font-weight:700;margin-top:-3px}
.navlinks{display:flex;align-items:center;gap:26px;color:#4c586b;font-size:13px;font-weight:650}.navlinks a:hover{color:#a87825}
.nav-cta{display:inline-flex;align-items:center;gap:9px;border-radius:999px;padding:12px 18px;font-weight:750;font-size:13px;background:var(--navy);color:#fff;transition:.2s}.nav-cta:hover{background:#263954}
.menu-btn{display:none;background:#f0f2f6;border:0;border-radius:12px;padding:10px;color:var(--ink);width:auto;margin:0}
.page{background:radial-gradient(circle at 80% 0,rgba(229,182,91,.18),transparent 30%),linear-gradient(135deg,#f8fafc 0%,#eef2f7 100%);padding:44px 0 60px;min-height:60vh}
#app{max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}
h1,h2{margin:0 0 8px;letter-spacing:-.04em}h1{font-size:clamp(30px,5vw,42px);line-height:1.1}h2{font-size:20px}.m{color:var(--muted);font-size:13px}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
input,select,textarea{font:inherit;width:100%;padding:13px 14px;border:1px solid #d5dbe5;border-radius:14px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
button,.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:14px;padding:13px 18px;border:0;border-radius:999px;background:var(--gold);color:var(--ink);font:inherit;font-weight:750;font-size:14px;cursor:pointer;transition:.2s}
button:hover,.btn:hover{background:#edc979;transform:translateY(-1px)}button:disabled{opacity:.6}
button.sec{background:#fff;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border:0}
.r{font-weight:850;color:#a87825;min-width:34px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:#eef2f7;font-size:12px;font-weight:700}.ok{background:#e3f4ec;color:var(--green)}.no{background:#fbe7e5;color:var(--red)}
.err{color:var(--red);font-weight:650;margin-top:10px}.copy{background:#f5f7fa;border:1px dashed #cfd6e0;padding:13px;border-radius:14px;word-break:break-word;font-size:14px}
footer{background:#0b1320;color:#c3ccda;padding:30px 0 20px;font-size:12px}footer .brand{color:#fff}.fl{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}.fl a{color:#9ba8ba;margin-left:16px}
@media(max-width:900px){.navlinks{gap:14px}}
@media(max-width:700px){.container{width:min(100% - 30px,var(--max))}.topbar .container span:last-child{display:none}.nav{height:66px}.menu-btn{display:block}.nav-cta{display:none}
.navlinks{display:none;position:absolute;top:66px;left:0;right:0;background:#fff;padding:17px 22px 22px;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:17px}.navlinks.open{display:flex}.card{padding:18px}}
</style></head><body>
<div class="topbar"><div class="container"><span><strong>TKP.</strong> RUANG CERITA &amp; KREATIVITAS POLEGE</span><span>Pendaftaran dan dukungan lomba</span></div></div>
<header><div class="container nav">
<a class="brand" href="index.html"><span class="brand-mark">TKP.</span><span>TITIK KUMPUL<small>POLEGE COMMUNITY</small></span></a>
<nav class="navlinks" id="navlinks"><a href="index.html">Beranda</a><a href="index.html#event">Event</a><a href="index.html#ranking">Top 10</a><a href="#daftar">Daftar</a><a href="#dukung">Dukung</a></nav>
<a class="nav-cta" href="#daftar">Daftar Lomba <span>↗</span></a><button class="menu-btn" id="menuBtn" aria-label="Buka menu">☰</button>
</div></header>
<div class="page"><div class="container"><main id="app"><p class="m">Memuat…</p></main></div></div>
<footer><div class="container fl"><a class="brand" href="index.html"><span class="brand-mark">TKP.</span><span>TITIK KUMPUL<small>POLEGE COMMUNITY</small></span></a><span>© <span id="yr"></span> Titik Kumpul Polege<a href="index.html">Beranda</a><a href="index.html#ranking">Top 10</a></span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
// ====== ISI BAGIAN INI ======
const SUPABASE_URL='https://qimygujcelfedblitmkw.supabase.co', ANON_KEY='sb_publishable_DgEqYjFW5UeHWfDESqG60g_0MTofHXU';
const SLUG='tkp-musim-1';                       // slug kompetisi
const PEMBAYARAN='Transfer ke BANK 0000000000 a.n. NAMA PENYELENGGARA (atau QRIS/e-wallet)'; // info bayar
const TAG='@titikkumpulpolege #TitikKumpulPolege';     // tag wajib di caption
const WA_ADMIN='6281234567890';                         // nomor WA bantuan
// ============================
const db=supabase.createClient(SUPABASE_URL,ANON_KEY),app=document.getElementById('app');
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function rpc(n,a){const{data,error}=await db.rpc(n,a||{});if(error)throw error;return data}
async function upload(folder,id,file){if(!file)throw new Error('Pilih foto bukti dulu');
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${folder}/${id}/${crypto.randomUUID()}.${ext}`;
 const{error}=await db.storage.from('bukti').upload(path,file,{contentType:file.type});if(error)throw error;return path}
const form=(id,f)=>{const e=document.getElementById(id);return e?e.value.trim():''};
const labelStatus={menunggu_bayar:'Menunggu pembayaran',menunggu_verifikasi:'Menunggu verifikasi admin',terverifikasi:'Terverifikasi',ditolak:'Ditolak'};
const labelVideo={belum_kirim:'Belum kirim',dikirim:'Menunggu diperiksa',disetujui:'Disetujui',ditolak:'Ditolak'};
const wa=t=>`https://wa.me/${WA_ADMIN}?text=${encodeURIComponent(t)}`;

async function home(){
 const{data:k,error:ke}=await db.from('competitions').select('nama,fase,pendaftaran_dibuka,voting_dibuka').eq('slug',SLUG).maybeSingle();
 if(!k)throw new Error(ke?ke.message:`Kompetisi dengan slug "${SLUG}" tidak ditemukan. Samakan SLUG di file ini dengan kolom slug di tabel competitions.`);
 const[kl,ps]=await Promise.all([rpc('klasemen_publik',{p_slug:SLUG}),rpc('daftar_peserta_publik',{p_slug:SLUG})]);
 app.innerHTML=`<div class="card"><h1>${esc(k.nama)}</h1><p class="m">Tahap: ${esc(k.fase.replace(/_/g,' '))}</p>
 ${k.pendaftaran_dibuka?'<a class="btn" href="#daftar">Daftar jadi peserta</a>':''}
 ${k.voting_dibuka?'<a class="btn" href="#dukung">Dukung peserta favoritmu</a>':''}</div>
 <div class="card"><h2>Klasemen sementara</h2>${kl.length?kl.map(r=>`<div class="row"><span class="r">${r.wildcard?'WC':r.peringkat}</span><span style="flex:1"><b>${esc(r.nama_panggung)}</b> ${r.wildcard?'<span class="tag ok">Wild Card</span>':''} <span class="m">${esc(r.kode_peserta)}</span></span><span>${r.perubahan>0?'▲'+r.perubahan:r.perubahan<0?'▼'+-r.perubahan:''} <b>${r.nilai_audisi??'-'}</b></span></div>`).join('')+`<p class="m">Diperbarui ${new Date(kl[0].terbit_at).toLocaleString('id-ID')}</p>`:'<p class="m">Klasemen belum terbit.</p>'}</div>
 <div class="card"><h2>Peserta resmi (${ps.length})</h2>${ps.map(p=>`<div class="row"><span><b>${esc(p.nama_panggung)}</b> <span class="m">${esc(p.kode_peserta)}</span></span><a href="${esc(p.video_url)}" target="_blank" rel="noopener">Tonton</a></div>`).join('')||'<p class="m">Belum ada.</p>'}</div>
 <p class="m">Sudah mendaftar? Buka link status yang kamu simpan, atau <a href="${wa('Halo admin, saya butuh bantuan lomba')}">hubungi admin</a>.</p>`}

async function daftar(){
 const{data:kk}=await db.from('competitions').select('pendaftaran_dibuka').eq('slug',SLUG).maybeSingle();
 if(!kk||!kk.pendaftaran_dibuka){app.innerHTML='<div class="card"><h2>Pendaftaran belum dibuka</h2><p class="m">Pantau terus halaman beranda untuk pengumuman pembukaan.</p><a class="btn" href="index.html">Kembali ke beranda</a></div>';return}
 const ref=new URLSearchParams(location.search).get('ref')||'';let nama='';
 if(ref){try{const r=await rpc('cek_referral',{p_kode:ref});nama=r[0]?.nama||''}catch(e){}}
 app.innerHTML=`<div class="card"><h2>Pendaftaran</h2>${nama?`<p class="m">Diajak oleh <b>${esc(nama)}</b> — biaya khusus berlaku.</p>`:''}
 <label>Nama lengkap</label><input id="n"><label>Nama panggung</label><input id="np">
 <label>Nomor WhatsApp</label><input id="wa" inputmode="tel" placeholder="08xxxxxxxxxx">
 <label>Akun TikTok (tanpa @)</label><input id="tt"><label>Akun Facebook</label><input id="fb">
 <button id="go">Daftar</button><div id="e" class="err"></div></div>`;
 document.getElementById('go').onclick=async b=>{const g=document.getElementById('go'),e=document.getElementById('e');g.disabled=true;e.textContent='';
  try{const r=(await rpc('daftar_peserta',{p_slug:SLUG,p_nama:form('n'),p_nama_panggung:form('np'),p_no_wa:form('wa'),p_tiktok:form('tt'),p_facebook:form('fb'),p_ref_kode:ref||null}))[0];
   try{localStorage.setItem('tkp_token',r.status_token)}catch(x){}
   bayar('peserta',r.peserta_id,r.jumlah_tagihan,r.status_token)}catch(x){e.textContent=x.message;g.disabled=false}}}

function bayar(folder,id,tagihan,token,info){
 app.innerHTML=`<div class="card"><h2>Langkah berikutnya: bayar</h2><p>Total yang dibayar: <b style="font-size:22px">${rp(tagihan)}</b></p>
 <div class="copy">${esc(PEMBAYARAN)}</div>${info?`<p class="m">${esc(info)}</p>`:''}
 <label>Unggah foto bukti pembayaran</label><input id="f" type="file" accept="image/*">
 <button id="up">Kirim bukti</button><div id="e" class="err"></div>
 <p class="m">Simpan link status kamu: <br><a href="#status/${token}">${location.origin+location.pathname}#status/${token}</a></p></div>`;
 document.getElementById('up').onclick=async()=>{const e=document.getElementById('e');e.textContent='';
  try{const p=await upload(folder,id,document.getElementById('f').files[0]);
   await rpc(folder==='vote'?'lampirkan_bukti_vote':'lampirkan_bukti_peserta',{p_token:token,p_path:p});
   location.hash=folder==='vote'?'voteok/'+token:'status/'+token}catch(x){e.textContent=x.message}}}

async function status(tok){
 const s=(await rpc('status_peserta',{p_token:tok}))[0];if(!s){app.innerHTML='<div class="card">Link tidak dikenali.</div>';return}
 const cap=`Audisi ${s.kompetisi_nama} | Kode ${s.kode_peserta} | ${TAG}`;
 let h=`<div class="card"><h2>Halo, ${esc(s.nama_panggung)}</h2><p>Pendaftaran: <span class="tag ${s.status==='terverifikasi'?'ok':s.status==='ditolak'?'no':''}">${labelStatus[s.status]}</span></p>
 ${s.catatan_pembayaran?`<p class="err">${esc(s.catatan_pembayaran)}</p>`:''}
 ${s.status==='menunggu_bayar'?`<a class="btn" href="#bayar/${tok}">Bayar & kirim bukti (${rp(s.jumlah_tagihan)})</a>`:''}</div>`;
 if(s.status==='terverifikasi'){h+=`<div class="card"><h2>Kode pesertamu: ${esc(s.kode_peserta)}</h2><p>Rekam videomu, unggah ke TikTok/Facebook dengan caption ini lalu kirim link videonya di bawah.</p>
 <div class="copy" id="cap">${esc(cap)}</div><button class="sec" id="cp">Salin caption</button>
 <p>Video: <span class="tag ${s.video_status==='disetujui'?'ok':s.video_status==='ditolak'?'no':''}">${labelVideo[s.video_status]}</span></p>${s.catatan_video?`<p class="err">${esc(s.catatan_video)}</p>`:''}
 ${s.fase==='audisi'?`<label>Platform</label><select id="pl"><option value="tiktok">TikTok</option><option value="facebook">Facebook</option></select>
 <label>Link video</label><input id="u" value="${esc(s.video_url||'')}"><button id="kv">Kirim link video</button><div id="e" class="err"></div>`:''}</div>`;
  if(s.peringkat)h+=`<div class="card"><h2>Peringkatmu sekarang: ${s.peringkat}</h2><p class="m">Nilai audisi ${s.nilai_audisi}. Ajak temanmu like, komen, dan dukung videomu!</p></div>`}
 app.innerHTML=h;const cp=document.getElementById('cp');if(cp)cp.onclick=()=>navigator.clipboard.writeText(cap).then(()=>cp.textContent='Tersalin ✓');
 const kv=document.getElementById('kv');if(kv)kv.onclick=async()=>{try{await rpc('kirim_video',{p_token:tok,p_platform:form('pl'),p_url:form('u')});status(tok)}catch(x){document.getElementById('e').textContent=x.message}}}

async function dukung(){
 const{data:kk}=await db.from('competitions').select('voting_dibuka').eq('slug',SLUG).maybeSingle();
 if(!kk||!kk.voting_dibuka){app.innerHTML='<div class="card"><h2>Voting belum dibuka</h2><p class="m">Pantau terus halaman beranda untuk pengumuman pembukaan.</p><a class="btn" href="index.html">Kembali ke beranda</a></div>';return}
 const[ps,{data:pk}]=await Promise.all([rpc('daftar_peserta_publik',{p_slug:SLUG}),db.from('vote_packages').select('id,nama,harga,jumlah_suara').order('urutan')]);
 const pre=new URLSearchParams(location.search).get('peserta')||'';
 app.innerHTML=`<div class="card"><h2>Dukung peserta</h2>
 <label>Pilih peserta</label><select id="ps">${ps.map(p=>`<option value="${p.peserta_id}" ${p.kode_peserta===pre?'selected':''}>${esc(p.nama_panggung)} (${esc(p.kode_peserta)})</option>`).join('')}</select>
 <label>Paket dukungan</label><select id="pk">${pk.map(p=>`<option value="${p.id}">${esc(p.nama)} — ${p.jumlah_suara} suara — ${rp(p.harga)}</option>`).join('')}</select>
 <label>Namamu</label><input id="n"><label>Nomor WhatsApp</label><input id="wa" inputmode="tel">
 <label>Nama yang tampil di dinding pendukung (boleh nama samaran)</label><input id="tn">
 <label>Pesan semangat (opsional)</label><textarea id="ms" maxlength="140"></textarea>
 <button id="go">Lanjut ke pembayaran</button><div id="e" class="err"></div></div>`;
 document.getElementById('go').onclick=async()=>{const e=document.getElementById('e');e.textContent='';
  try{const r=(await rpc('buat_vote',{p_participant_id:form('ps'),p_package_id:form('pk'),p_nama:form('n'),p_no_wa:form('wa'),p_tampil_nama:form('tn')||null,p_tampil_di_dinding:true,p_pesan:form('ms')||null}))[0];
   bayar('vote',r.vote_id,r.jumlah_tagihan,r.tracking_token,`Nomor transaksi: ${r.nomor_transaksi} — cantumkan di berita transfer.`)}catch(x){e.textContent=x.message}}}

async function voteok(tok){const v=(await rpc('status_vote',{p_token:tok}))[0];
 app.innerHTML=v?`<div class="card"><h2>Terima kasih!</h2><p>Dukungan ${v.jumlah_suara} suara untuk <b>${esc(v.nama_peserta)}</b> — ${labelStatus[v.status]}.</p><p class="m">Nomor transaksi ${esc(v.nomor_transaksi)}. Setelah admin memverifikasi, suaramu dihitung.</p><a class="btn" href="#">Kembali</a></div>`:'<div class="card">Tidak ditemukan.</div>'}

async function route(){const[p,a]=location.hash.slice(1).split('/');app.innerHTML='<p class="m">Memuat…</p>';
 try{if(p==='daftar')await daftar();else if(p==='status')await status(a);else if(p==='bayar'){const s=(await rpc('status_peserta',{p_token:a}))[0];bayar('peserta',s.peserta_id,s.jumlah_tagihan,a)}
 else if(p==='dukung')await dukung();else if(p==='voteok')await voteok(a);else await home()}
 catch(x){app.innerHTML=`<div class="card err">${esc(x.message)}</div>`}}
addEventListener('hashchange',route);route();
</script><script>document.getElementById("yr").textContent=new Date().getFullYear();const mb=document.getElementById("menuBtn"),nl=document.getElementById("navlinks");mb.onclick=()=>{const o=nl.classList.toggle("open");mb.textContent=o?"✕":"☰"};nl.querySelectorAll("a").forEach(a=>a.onclick=()=>{nl.classList.remove("open");mb.textContent="☰"});</script>
</body></html>
