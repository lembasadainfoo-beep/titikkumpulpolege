<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>TKP — Dashboard</title>
<style>
:root{--ink:#172235;--m:#687386;--line:#e7ebf1;--navy:#101827;--gold:#e5b65b;--g:#287c62;--r:#b3392f}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fa;color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
nav button{background:none;color:#fff;border:0;padding:8px 12px;cursor:pointer;font:inherit;border-radius:8px}nav button.on{background:var(--gold);color:var(--navy);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--m);font-size:12px}
input,select{font:inherit;padding:8px;border:1px solid #cfd6e0;border-radius:8px;max-width:100%}td input[type=number]{width:90px}
button.b{background:var(--gold);border:0;border-radius:8px;padding:7px 11px;font:inherit;font-weight:600;cursor:pointer;margin:2px;color:var(--navy)}
button.b.s{background:#fff;border:1px solid #cfd6e0}button.b.d{background:#fbe7e5;color:var(--r)}button:disabled{opacity:.5}
.tag{padding:2px 8px;border-radius:99px;background:#eef2f7;font-size:12px;font-weight:600}.ok{background:#e3f4ec;color:var(--g)}.no{background:#fbe7e5;color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k{background:#f5f7fa;border-radius:10px;padding:10px}.k b{font-size:22px;display:block}
.err{color:var(--r);font-weight:600;margin:8px 0}#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;display:none}
</style></head><body>
<header><b id="ttl">TKP Dashboard</b><select id="evSel" style="display:none"></select><nav id="nav"></nav><button class="b s" id="out" style="display:none">Keluar</button></header>
<main id="app"></main><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
// ====== ISI BAGIAN INI ======
const SUPABASE_URL='https://qimygujcelfedblitmkw.supabase.co', ANON_KEY='sb_publishable_DgEqYjFW5UeHWfDESqG60g_0MTofHXU';
let SLUG='tkp-musim-1';
const PESERTA_URL='https://DOMAINMU/peserta.html';   // alamat halaman peserta
const TAG='@titikkumpulpolege #TitikKumpulPolege';
// ============================
const db=supabase.createClient(SUPABASE_URL,ANON_KEY),app=document.getElementById('app'),nav=document.getElementById('nav');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
let C,ME,tab='ring';
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
async function rpc(n,a){const{data,error}=await db.rpc(n,a||{});if(error)throw error;return data}
async function aksi(fn,ok,reload){try{await fn();toast(ok||'Berhasil');if(reload!==false)render()}catch(x){alert(x.message)}}
const waOpen=(no,t)=>window.open(`https://wa.me/${no}?text=${encodeURIComponent(t)}`,'_blank');
const link=t=>`${PESERTA_URL}#status/${t}`;
const WA={
 terdaftar:p=>`Selamat ${p.nama_panggung}, pendaftaranmu di ${C.nama} sudah terverifikasi! Kode pesertamu ${p.kode_peserta}. Caption videomu: "Audisi ${C.nama} | Kode ${p.kode_peserta} | ${TAG}". Setelah diunggah, kirim link videonya di sini: ${link(p.status_token)}`,
 video_ok:p=>`Halo ${p.nama_panggung}, videomu sudah disetujui dan kamu resmi jadi peserta ${C.nama}! Ajak teman like, komen, dan dukung videomu ya. Cek statusmu: ${link(p.status_token)}`,
 video_tolak:p=>`Halo ${p.nama_panggung}, videomu belum bisa kami setujui: ${p.video_catatan||'-'}. Silakan kirim ulang di ${link(p.status_token)}`,
 bayar_tolak:p=>`Halo ${p.nama}, pembayaranmu belum bisa kami verifikasi: ${p.catatan_admin||'-'}. Cek di ${link(p.status_token)}`,
 tagih:p=>`Halo ${p.nama}, pendaftaranmu di ${C.nama} sudah tercatat tapi pembayarannya belum kami terima. Lanjutkan pembayaran dan unggah bukti di sini: ${link(p.status_token)}`,
 ingatkan:p=>`Halo ${p.nama_panggung}, jangan lupa kirim video audisimu di ${link(p.status_token)} sebelum batas waktu ya!`
};
async function load(){C=(await db.from('competitions').select('*').eq('slug',SLUG).maybeSingle()).data}

async function boot(){
 const{data:{session}}=await db.auth.getSession();
 if(!session){app.innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>Masuk</h2><p><input id="em" type="email" placeholder="Email" style="width:100%"></p><p><input id="pw" type="password" placeholder="Password" style="width:100%"></p><button class="b" id="li">Masuk</button><div class="err" id="e"></div></div>`;
  $('li').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(error)$('e').textContent='Email atau password salah';else boot()};return}
 ME=(await db.from('profiles').select('role,nama').eq('id',session.user.id).single()).data;
 if(!ME){app.innerHTML='<div class="card err">Akun ini belum terdaftar sebagai admin/juri.</div>';return}
 $('out').style.display='';$('out').onclick=async()=>{await db.auth.signOut();location.reload()};
 await pilihEvent();await load();$('ttl').textContent=`TKP · ${ME.nama} (${ME.role})`;
 if(ME.role==='juri'){nav.innerHTML='';juri();return}
 if(!C)tab='evt';
 const T={evt:'Event',ring:'Ringkasan',pes:'Peserta',vot:'Dukungan',kla:'Klasemen',tah:'Tahap & Final',nil:'Penilaian',kon:'Konten Situs'};
 nav.innerHTML=Object.entries(T).map(([k,v])=>`<button data-t="${k}" class="${k===tab?'on':''}">${v}</button>`).join('');
 nav.onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;boot()}};
 const es=$('evSel');if(EVL.length){es.style.display='';es.innerHTML=EVL.map(x=>`<option value="${esc(x.slug)}" ${x.slug===SLUG?'selected':''}>${esc(x.nama)}</option>`).join('');es.onchange=()=>{SLUG=es.value;try{localStorage.setItem('tkp_slug',SLUG)}catch(e){}boot()}}
 render()}

function render(){({evt,ring,pes,vot,kla,tah,nil,kon})[tab]().catch(x=>app.innerHTML=`<div class="card err">${esc(x.message)}</div>`)}

async function pilihEvent(){const{data:ls}=await db.from('competitions').select('slug,nama,fase').order('dibuat_at',{ascending:false});window.EVL=ls||[];
 let s=null;try{s=localStorage.getItem('tkp_slug')}catch(e){}
 if(!EVL.some(x=>x.slug===s)){const{data:a}=await db.from('site_settings').select('value').eq('key','event_aktif').maybeSingle();s=a&&EVL.some(x=>x.slug===a.value)?a.value:(EVL[0]?EVL[0].slug:SLUG)}
 SLUG=s}
const slugify=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
async function evt(){
 const{data:ls}=await db.from('competitions').select('*').order('dibuat_at',{ascending:false});window.EVL=ls||[];
 const{data:ak}=await db.from('site_settings').select('value').eq('key','event_aktif').maybeSingle(),aktif=ak?ak.value:'';
 const grp=(t,f)=>{const r=EVL.filter(x=>f.includes(x.fase));return `<h4>${t} (${r.length})</h4>`+(r.length?`<table><tr><th>Event</th><th>Tahap</th><th>Aksi</th></tr>${r.map(x=>`<tr><td><b>${esc(x.nama)}</b><br><span style="color:var(--m)">${esc(x.slug)}</span> ${x.slug===aktif?'<span class="tag ok">tampil di situs</span>':''} ${x.slug===SLUG?'<span class="tag">sedang dikelola</span>':''}</td><td>${esc(x.fase.replace(/_/g,' '))}</td><td>${x.slug!==SLUG?`<button class="b s" onclick="kelola('${x.slug}')">Kelola</button>`:''}${x.slug!==aktif?`<button class="b s" onclick="jadikanAktif('${x.slug}')">Tampilkan di situs</button>`:''}${x.fase==='belum_mulai'?`<button class="b" onclick="mulaiEvent('${x.slug}')">Mulai &amp; buka pendaftaran</button>`:''}</td></tr>`).join('')}</table>`:'<p style="color:var(--m)">Belum ada.</p>')};
 const ta=(id,v,n)=>`<textarea id="${id}" rows="${n}" style="width:100%;font:inherit;padding:8px;border:1px solid #cfd6e0;border-radius:8px">${v}</textarea>`,f=(id,l,v,t='text')=>`<label>${l}<br><input id="${id}" type="${t}" value="${v}" style="width:100%"></label>`;
 app.innerHTML=`<div class="card"><h3>Daftar event</h3><p style="color:var(--m)">"Kelola" mengganti event yang sedang diatur di dashboard. "Tampilkan di situs" menentukan event yang dipakai halaman daftar, dukung, dan klasemen.</p>${grp('Sedang berjalan',['audisi','finalis_ditetapkan','final'])}${grp('Akan segera',['belum_mulai'])}${grp('Sudah selesai',['selesai','arsip'])}</div>
 <div class="card"><h3>Buat event baru</h3>${f('e_nama','Nama event','Lomba Karaoke TKP Musim 1')}${f('e_slug','Kode event (otomatis dari nama, huruf kecil dan tanda -)','')}${f('e_pre','Awalan kode peserta (2-6 huruf/angka besar)','TKP')}
 <div class="grid"><div>${f('e_hm','Biaya daftar mandiri (Rp)',10000,'number')}</div><div>${f('e_hr','Biaya daftar lewat teman (Rp)',5000,'number')}</div><div>${f('e_so','Finalis lolos otomatis',8,'number')}</div><div>${f('e_sw','Slot wild card',2,'number')}</div><div>${f('e_jj','Jumlah juri',3,'number')}</div></div>
 ${f('e_bt','Batas kirim video audisi (opsional)','','datetime-local')}
 <label>Paket dukungan (satu per baris: nama|harga|jumlah suara)<br>${ta('e_pk','Dukung 1 suara|5000|1\nPaket 3 suara|10000|3\nPaket 10 suara|25000|10',3)}</label>
 <label>Kriteria juri (satu per baris: nama|bobot, total harus 100)<br>${ta('e_kr','Kualitas vokal|50\nTeknik dan ekspresi|30\nPenampilan|20',3)}</label>
 <p><label><input type="checkbox" id="e_kartu" checked> Buat juga kartu event di beranda (bisa diubah di Konten Situs)</label><br><label><input type="checkbox" id="e_aktif" checked> Jadikan event yang tampil di situs</label></p>
 <button class="b" id="e_save">Buat event</button></div>`;
 $('e_nama').oninput=()=>{if(!$('e_slug').dataset.m)$('e_slug').value=slugify($('e_nama').value)};$('e_slug').oninput=()=>$('e_slug').dataset.m=1;
 $('e_save').onclick=()=>aksi(async()=>{
  const nama=$('e_nama').value.trim(),slug=$('e_slug').value.trim().toLowerCase()||slugify(nama),pre=$('e_pre').value.trim().toUpperCase();
  if(!nama)throw new Error('Nama event wajib diisi');
  if(!/^[a-z0-9-]+$/.test(slug))throw new Error('Kode event hanya boleh huruf kecil, angka, dan tanda -');
  if(!/^[A-Z0-9]{2,6}$/.test(pre))throw new Error('Awalan kode peserta 2-6 huruf atau angka besar');
  const parse=t=>t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split('|').map(x=>x.trim()));
  const pk=parse($('e_pk').value).map(([n,h,s],i)=>({nama:n,harga:+h,jumlah_suara:+s,urutan:i+1})),kr=parse($('e_kr').value).map(([n,b],i)=>({nama:n,bobot:+b,urutan:i+1}));
  if(!pk.length||pk.some(x=>!x.nama||!(x.harga>0)||!(x.jumlah_suara>0)))throw new Error('Format paket: nama|harga|jumlah suara, satu per baris');
  if(!kr.length||kr.some(x=>!x.nama||!(x.bobot>0))||kr.reduce((a,x)=>a+x.bobot,0)!==100)throw new Error('Kriteria juri: nama|bobot, satu per baris, total bobot harus 100');
  const bt=$('e_bt').value;
  const{data:c,error}=await db.from('competitions').insert({slug,nama,kode_prefix:pre,harga_daftar_mandiri:+$('e_hm').value,harga_daftar_referral:+$('e_hr').value,jumlah_slot_otomatis:+$('e_so').value,jumlah_slot_wildcard:+$('e_sw').value,jumlah_juri:+$('e_jj').value,batas_unggah_video:bt?new Date(bt).toISOString():null}).select().single();
  if(error)throw new Error(error.message.includes('duplicate')?'Kode event sudah dipakai event lain':error.message);
  const r1=await db.from('vote_packages').insert(pk.map(x=>({...x,competition_id:c.id})));if(r1.error)throw r1.error;
  const r2=await db.from('judging_criteria').insert(kr.map(x=>({...x,competition_id:c.id})));if(r2.error)throw r2.error;
  if($('e_kartu').checked){const r3=await db.from('site_items').insert({jenis:'event',judul:nama,label:'LOMBA',deskripsi:'Ikuti perkembangan lomba dan dukung peserta favoritmu.',competition_slug:slug,urutan:0});if(r3.error)throw r3.error}
  if($('e_aktif').checked||!EVL.length){const r4=await db.from('site_settings').upsert({key:'event_aktif',value:slug});if(r4.error)throw r4.error}
  SLUG=slug;try{localStorage.setItem('tkp_slug',slug)}catch(e){}
 },'Event dibuat. Klik "Mulai & buka pendaftaran" saat siap.')}
window.kelola=s=>{SLUG=s;try{localStorage.setItem('tkp_slug',s)}catch(e){}boot()};
window.jadikanAktif=s=>aksi(async()=>{const{error}=await db.from('site_settings').upsert({key:'event_aktif',value:s});if(error)throw error},'Event ditampilkan di situs');
window.mulaiEvent=s=>confirm('Mulai audisi dan buka pendaftaran untuk event ini?')&&aksi(async()=>{await rpc('admin_ubah_fase',{p_slug:s,p_fase:'audisi'});const{error}=await db.from('competitions').update({pendaftaran_dibuka:true}).eq('slug',s);if(error)throw error},'Pendaftaran dibuka. Buka voting di tab Tahap & Final saat sudah ada peserta resmi.');

async function ring(){await load();const r=(await rpc('admin_ringkasan',{p_slug:SLUG}))[0],k=(l,v)=>`<div class="k">${l}<b>${v}</b></div>`;
 app.innerHTML=`<div class="card"><h3>${esc(C.nama)} — tahap: ${esc(C.fase)}</h3><div class="grid">
 ${k('Peserta menunggu verifikasi',r.peserta_menunggu_verifikasi)}${k('Peserta terverifikasi',r.peserta_terverifikasi)}${k('Video perlu diperiksa',r.video_menunggu_review)}${k('Video disetujui',r.video_disetujui)}
 ${k('Dukungan menunggu verifikasi',r.vote_menunggu_verifikasi)}${k('Dukungan terverifikasi',r.vote_terverifikasi)}${k('Total suara',r.total_suara)}
 ${k('Pemasukan pendaftaran',rp(r.pendapatan_pendaftaran))}${k('Pemasukan dukungan',rp(r.pendapatan_vote))}</div></div>
 <div class="card"><h3>Imbalan teman</h3><table><tr><th>Teman</th><th>Pendaftar</th><th>Komisi/orang</th><th>Total</th><th>Sisa</th></tr>${(await rpc('admin_rekap_referral',{p_slug:SLUG})).map(x=>`<tr><td>${esc(x.nama)} <span class="tag">${esc(x.kode)}</span></td><td>${x.jumlah_pendaftar}</td><td>${x.komisi_per_pendaftar==null?'-':rp(x.komisi_per_pendaftar)}</td><td>${rp(x.total_komisi)}</td><td>${rp(x.sisa)}</td></tr>`).join('')}</table>
 <p style="color:var(--m)">Tambah teman: Supabase → Table Editor → referrers.</p></div>`}

async function bukti(path){const{data,error}=await db.storage.from('bukti').createSignedUrl(path,600);if(error)return alert(error.message);window.open(data.signedUrl,'_blank')}
window.bukti=bukti;
async function pes(){const{data}=await db.from('participants').select('*').eq('competition_id',C.id).order('created_at',{ascending:false});window.P=data;
 const st=s=>`<span class="tag ${s==='terverifikasi'||s==='disetujui'?'ok':s==='ditolak'?'no':''}">${s.replace(/_/g,' ')}</span>`;
 app.innerHTML=`<div class="card"><input id="q" placeholder="Cari nama / kode / WA" style="width:100%;margin-bottom:8px"><table id="t"><tr><th>Peserta</th><th>Bayar</th><th>Video</th><th>Aksi</th></tr>${data.map((p,i)=>`<tr data-s="${esc((p.nama+p.nama_panggung+(p.kode_peserta||'')+p.no_wa).toLowerCase())}"><td><b>${esc(p.nama_panggung)}</b> ${esc(p.kode_peserta||'')} ${p.wildcard_calon?'<span class="tag ok">Wild Card</span>':''}<br>${esc(p.nama)} · ${p.no_wa}<br>${p.referrer_id?'<span class="tag">referral</span> ':''}${rp(p.harga_daftar+p.kode_unik)}</td>
 <td>${st(p.status)}<br>${p.bukti_bayar_path?`<a href="#" onclick="bukti('${p.bukti_bayar_path}');return false">Lihat bukti</a>`:''}</td>
 <td>${st(p.video_status)}<br>${p.video_url?`<a href="${esc(p.video_url)}" target="_blank" rel="noopener">Buka video</a>`:''}</td>
 <td>${p.status!=='terverifikasi'?`<button class="b" onclick="act(${i},'ver')">Verifikasi</button><button class="b d" onclick="act(${i},'tol')">Tolak</button>`:''}
 ${p.video_status==='disetujui'?`<button class="b s" onclick="act(${i},'wc')">${p.wildcard_calon?'Cabut wild card':'Beri wild card'}</button><button class="b s" onclick="act(${i},'vopen')">Buka kunci video</button>`:''}
 ${p.video_status==='dikirim'?`<button class="b" onclick="act(${i},'vok')">Setujui video</button><button class="b d" onclick="act(${i},'vno')">Tolak video</button>`:''}
 <select id="w${i}"><option value="terdaftar">WA: terdaftar</option><option value="video_ok">WA: video disetujui</option><option value="video_tolak">WA: video ditolak</option><option value="bayar_tolak">WA: bayar ditolak</option><option value="tagih">WA: tagih pembayaran</option><option value="ingatkan">WA: pengingat</option></select><button class="b s" onclick="act(${i},'wa')">Kirim</button></td></tr>`).join('')}</table></div>`;
 $('q').oninput=e=>document.querySelectorAll('#t tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(e.target.value.toLowerCase())?'':'none')}
window.act=async(i,a)=>{const p=P[i];
 if(a==='ver')aksi(()=>rpc('admin_verifikasi_peserta',{p_id:p.id}),'Terverifikasi. Kirim WA terdaftar dari tombol Kirim.');
 if(a==='tol'){const r=prompt('Alasan menolak pembayaran:');if(r)aksi(()=>rpc('admin_tolak_peserta',{p_id:p.id,p_alasan:r}))}
 if(a==='vok')aksi(()=>rpc('admin_setujui_video',{p_id:p.id}),'Video disetujui');
 if(a==='vno'){const r=prompt('Alasan menolak video (mis. tag/kode belum ada):');if(r)aksi(()=>rpc('admin_tolak_video',{p_id:p.id,p_alasan:r}))}
 if(a==='vopen'){const r=prompt('Alasan membuka penggantian video:','Silakan kirim ulang video yang benar');if(r)aksi(()=>rpc('admin_tolak_video',{p_id:p.id,p_alasan:r}),'Peserta bisa mengirim ulang video')}
 if(a==='wc')aksi(()=>rpc('admin_set_wildcard',{p_id:p.id,p_aktif:!p.wildcard_calon}),p.wildcard_calon?'Wild card dicabut':'Wild card diberikan');
 if(a==='wa'){const k=$('w'+i).value;waOpen(p.no_wa,WA[k](p))}};

async function vot(){const{data}=await db.from('votes').select('*,participants(nama_panggung)').eq('competition_id',C.id).order('created_at',{ascending:false});window.V=data;
 app.innerHTML=`<div class="card"><table><tr><th>Pendukung</th><th>Untuk</th><th>Tagihan</th><th>Status</th><th>Aksi</th></tr>${data.map((v,i)=>`<tr><td><b>${esc(v.nama_pendukung)}</b><br>${v.no_wa}<br><span style="color:var(--m)">${esc(v.nomor_transaksi)}</span></td><td>${esc(v.participants.nama_panggung)}<br>${v.jumlah_suara} suara</td><td>${rp(v.harga+v.kode_unik)}<br>${v.bukti_bayar_path?`<a href="#" onclick="bukti('${v.bukti_bayar_path}');return false">Lihat bukti</a>`:'<i>belum ada bukti</i>'}</td>
 <td><span class="tag ${v.status==='terverifikasi'?'ok':v.status==='ditolak'?'no':''}">${v.status.replace(/_/g,' ')}</span></td>
 <td>${v.status!=='terverifikasi'&&v.status!=='ditolak'?`<button class="b" onclick="vact(${i},'ver')">Verifikasi</button><button class="b d" onclick="vact(${i},'tol')">Tolak</button>`:''}${v.status==='terverifikasi'?`<button class="b s" onclick="vact(${i},'wa')">WA terima kasih</button>`:''}</td></tr>`).join('')}</table></div>`}
window.vact=(i,a)=>{const v=V[i];

async function juri(){
 await load();
 const[ak,kr]=await Promise.all([rpc('juri_peserta_aktif',{p_slug:SLUG}),db.from('judging_criteria').select('*').eq('competition_id',C.id).order('urutan')]);
 const K=kr.data,p=ak[0];window.JK=p?p.peserta_id:null;
 clearInterval(window.JT);window.JT=setInterval(async()=>{try{const a=(await rpc('juri_peserta_aktif',{p_slug:SLUG}))[0];if((a?a.peserta_id:null)!==JK)juri()}catch(x){}},5000);
 if(C.fase!=='final'){app.innerHTML='<div class="card">Penilaian belum dibuka. Tunggu admin memulai tahap final.</div>';return}
 if(!p){app.innerHTML='<div class="card"><h3>Menunggu peserta berikutnya</h3><p>Admin belum menampilkan peserta. Halaman ini berganti otomatis.</p></div>';return}
 const{data:own}=await db.from('juri_scores').select('*').eq('participant_id',p.peserta_id),S={};own.forEach(s=>S[s.criterion_id]=s);const lock=p.sudah_dikirim;
 app.innerHTML=`<div class="card"><span class="tag">Sedang dinilai</span><h2 style="margin:8px 0">${esc(p.nama_panggung)}</h2><p>Nomor peserta: <b>${esc(p.kode_peserta)}</b> · <a href="${esc(p.video_url)}" target="_blank" rel="noopener">Tonton video</a></p>
 <table>${K.map((k,j)=>`<tr><td><b>${esc(k.nama)}</b> <span style="color:var(--m)">(${k.bobot}%)</span></td><td><input type="number" min="0" max="100" step="0.5" id="s${j}" value="${S[k.id]?.skor??''}" ${lock?'disabled':''} oninput="hit()" style="width:110px"></td></tr>`).join('')}</table>
 <p>Nilai kamu untuk peserta ini: <b id="hs" style="font-size:22px">-</b></p>
 ${lock?'<p><span class="tag ok">Nilai sudah dikirim ✓</span> Tunggu peserta berikutnya.</p>':'<button class="b" id="kr">Kirim nilai</button>'}</div>`;
 window.hit=()=>{let t=0,ok=true;K.forEach((k,j)=>{const v=$('s'+j).value;if(v==='')ok=false;else t+=v*k.bobot/100});$('hs').textContent=ok?t.toFixed(2):'-'};hit();
 if(!lock)$('kr').onclick=()=>confirm('Kirim nilai untuk '+p.nama_panggung+'? Setelah dikirim tidak bisa diubah.')&&aksi(async()=>{
  if(K.some((k,j)=>$('s'+j).value===''))throw new Error('Isi semua kriteria dulu');
  const{data:{user}}=await db.auth.getUser();
  const{error}=await db.from('juri_scores').upsert(K.map((k,j)=>({competition_id:C.id,participant_id:p.peserta_id,juri_id:user.id,criterion_id:k.id,skor:+$('s'+j).value})),{onConflict:'participant_id,juri_id,criterion_id'});if(error)throw error;
  await rpc('juri_kirim_nilai',{p_slug:SLUG})},'Nilai terkirim',false).then(()=>juri())}
boot();
</script></body></html>
